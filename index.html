<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一格記事">
<title>一格記事</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.22); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --grey:#8E8E93; --darkgrey:#5B5B60;
  --ring:#C7C7CC; --listbg:#FFFFFF; --bar:rgba(249,249,249,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
    --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --grey:#98989D; --darkgrey:#6C6C70;
    --ring:#48484A; --listbg:#000000; --bar:rgba(22,22,22,.86);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.29;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
body.inlist{background:var(--listbg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.view{max-width:700px;margin:0 auto;padding:calc(var(--sat) + 8px) calc(16px + var(--sar)) calc(96px + var(--sab)) calc(16px + var(--sal))}

/* ===== 首頁 ===== */
.navrow{height:10px}
.navbtn{color:var(--blue);font-size:17px;padding:8px 4px;display:inline-flex;align-items:center;gap:2px}
.navbtn svg{width:24px;height:24px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;margin:4px 0 18px}
.search svg{width:17px;height:17px;color:var(--grey);flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--label2)}
.search .clr{width:20px;height:20px;border-radius:50%;background:var(--grey);color:var(--card);display:grid;place-items:center;flex:none;opacity:.8}
.search .clr svg{width:10px;height:10px;color:var(--card)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:12px;padding:10px 12px 9px;text-align:left;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;row-gap:8px;min-height:84px;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:19px;height:19px}
.tile .num{font-size:28px;font-weight:700;line-height:34px;text-align:right}
.tile .nm{grid-column:1/3;color:var(--label2);font-weight:600;font-size:16px}
.sechd{font-size:22px;font-weight:700;margin:26px 4px 8px}
.group{background:var(--card);border-radius:12px;overflow:hidden;list-style:none;margin:0;padding:0}
.lrow{display:flex;align-items:center;gap:12px;padding:0 0 0 14px;min-height:52px;width:100%;text-align:left}
.lrow:active{background:var(--fill)}
.lrow .lic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.lrow .lic svg{width:16px;height:16px}
.lrow .lin{flex:1;min-width:0;display:flex;align-items:center;gap:8px;align-self:stretch;border-bottom:.5px solid var(--sep);padding-right:12px}
.group li:last-child .lin{border-bottom:0}
.lrow .lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lcnt{color:var(--label2)}
.lrow .chev{width:8px;height:14px;color:var(--label3)}
.hint{color:var(--label2);font-size:13px;text-align:center;margin:22px 12px 0;line-height:1.5}

/* ===== 底部工具列 ===== */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.toolbar .in{max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px calc(16px + var(--sar)) calc(8px + var(--sab)) calc(14px + var(--sal));min-height:50px}
.newbtn{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--blue);font-size:17px;padding:6px 0}
.newbtn .pl{width:26px;height:26px;border-radius:50%;background:currentColor;display:grid;place-items:center}
.newbtn .pl svg{width:14px;height:14px;color:var(--card)}
.newbtn:disabled{opacity:.35}
.addlist{color:var(--blue);font-size:17px;padding:6px 0}

/* ===== 列表頁 ===== */
.lnav{position:sticky;top:0;z-index:20;background:var(--listbg);margin:0 -16px;padding:calc(var(--sat)) 8px 0;display:flex;align-items:center;justify-content:space-between;height:calc(44px + var(--sat))}
.lnav .ttl{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;opacity:0;transition:opacity .15s;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.lnav.scrolled .ttl{opacity:1}
.lnav.scrolled{border-bottom:.5px solid var(--sep)}
.bigtitle{font-size:34px;font-weight:700;margin:2px 0 4px;letter-spacing:.01em;word-break:break-word}
.donebar{display:flex;align-items:center;gap:6px;color:var(--label2);font-size:15px;padding:6px 0 8px;border-bottom:.5px solid var(--sep);margin-bottom:2px}
.donebar .sp{flex:1}
.donebar button{color:var(--blue);font-size:15px;padding:4px 0}
.donebar button:disabled{color:var(--label3)}
.sec{margin-top:14px}
.sec h4{margin:12px 0 2px;font-size:20px;font-weight:700}
.sec h4.small{font-size:15px;color:var(--label2);font-weight:600;text-transform:none}
.rows{list-style:none;margin:0;padding:0}
.empty{color:var(--label2);text-align:center;padding:56px 12px 8px;font-size:17px}
.empty small{display:block;font-size:14px;margin-top:8px;line-height:1.55;color:var(--label2)}
.tapzone{min-height:calc(38vh / var(--z, 1))}

/* 單一提醒事項 */
.row{position:relative;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row .acts{position:absolute;top:0;bottom:0;right:0;display:flex;visibility:hidden}
.row.swiping .acts,.row.open .acts,.row.full .acts{visibility:visible}
.row .acts button{width:76px;color:#fff;font-size:15px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.row .acts svg{width:20px;height:20px}
.a-info{background:#8E8E93}.a-flag{background:var(--orange)}.a-del{background:var(--red)}
.row.full .a-info,.row.full .a-flag{width:0;overflow:hidden;padding:0}
.row.full .a-del{width:100vw;max-width:700px;align-items:flex-start;padding-left:22px}
.fg{position:relative;background:var(--listbg);display:flex;align-items:flex-start;gap:12px;padding:0 0 0 2px;transition:transform .25s cubic-bezier(.2,.8,.2,1);will-change:transform}
.row.swiping .fg,.row.dragging .fg{transition:none}
.circle{width:24px;height:24px;margin-top:9px;flex:none;border-radius:50%;border:1.6px solid var(--ring);display:grid;place-items:center;position:relative}
.circle::before{content:"";position:absolute;inset:-10px}
.circle i{width:14px;height:14px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .18s}
.row.done .circle{border-color:var(--c)}
.row.done .circle i{transform:scale(1)}
.rbody{flex:1;min-width:0;padding:10px 12px 10px 0;border-bottom:.5px solid var(--sep);display:flex;gap:8px;align-items:flex-start;min-height:44px}
.rtext{flex:1;min-width:0}
.title{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;min-height:22px}
.row.done .title{color:var(--label2)}
.prio{color:var(--c);font-weight:600;margin-right:3px}
.notes{color:var(--label2);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl{color:var(--c, var(--blue));font-weight:600}
.row.flagged .title{font-weight:600}
.meta{color:var(--label2);font-size:15px;margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.meta .od{color:var(--red)}
.meta svg{width:13px;height:13px;vertical-align:-1px}
.meta .ln{color:var(--label2)}
.flagic{width:16px;height:16px;color:var(--orange);margin-top:3px;flex:none}
.infobtn{width:24px;height:24px;color:var(--blue);flex:none;margin-top:-1px}
.infobtn svg{width:24px;height:24px}
.editbtns{display:flex;flex-direction:column;gap:14px;flex:none;align-items:center}
.etitle{display:block;width:100%;border:0;background:transparent;outline:none;resize:none;padding:0;margin:0;line-height:1.29;min-height:22px;-webkit-user-select:text;user-select:text}
.etitle::placeholder{color:var(--label2);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{height:28px;padding:0 10px;border-radius:14px;background:var(--fill);font-size:14px;display:inline-flex;align-items:center;gap:4px;color:var(--label)}
.chip svg{width:15px;height:15px}
.chip.on{background:var(--blue);color:#fff}
.chip.flagon{background:var(--orange);color:#fff}
.row.dragging{z-index:5;overflow:visible}
.row.pressed .fg{background:var(--fill);transform:scale(.985);border-radius:10px;transition:transform .15s,background .15s}
.row.dragging .fg{box-shadow:0 8px 28px rgba(0,0,0,.22);border-radius:10px;transform:scale(1.02)}
.row.leaving{animation:leave .25s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(-30%)}}
.row.flash .fg{animation:flash 1s ease}
@keyframes flash{0%{background:var(--fill2)}100%{background:var(--listbg)}}

/* 編輯中可自由捲動 */
.row.editing{touch-action:auto;-webkit-user-select:text;user-select:text}
.etitle{max-height:calc(30vh / var(--z, 1));overflow-y:auto}
.enotes{display:block;width:100%;border:0;background:transparent;outline:none;resize:none;padding:0;margin:4px 0 0;font-size:15px;line-height:1.4;color:var(--label2);max-height:calc(40vh / var(--z, 1));overflow-y:auto;overscroll-behavior:contain;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.enotes::placeholder{color:var(--label2)}
.enotes.collapsed{max-height:2.8em}
.ntog{display:block;color:var(--blue);font-size:14px;font-weight:600;padding:6px 0 2px}
.chips{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;touch-action:pan-x;margin-right:-12px;padding-right:12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap}
.a-copy{background:var(--blue)}
/* 分類 */
.shdr{display:flex;align-items:center;gap:4px;padding:22px 0 6px;border-bottom:.5px solid var(--sep);list-style:none}
.shname{flex:1;min-width:0;text-align:left;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.shcnt{color:var(--label2);font-size:15px}
.shtog{width:34px;height:34px;display:grid;place-items:center;color:var(--label2);flex:none}
.shtog svg{width:14px;height:14px;transition:transform .2s}
.shdr.collapsed .shtog svg{transform:rotate(-90deg)}
.addrow{list-style:none}
.addrow button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0 9px 2px;color:var(--label3);font-size:16px;text-align:left}
.addrow .pl{width:24px;height:24px;border-radius:50%;border:1.6px dashed var(--ring);display:grid;place-items:center;flex:none}
.addrow .pl svg{width:12px;height:12px}
/* 選取模式 */
.circle .ck{display:none;width:14px;height:14px;color:#fff}
.circle.sel{background:var(--blue);border-color:var(--blue)}
.circle.sel i{display:none}
.circle.sel .ck{display:block}
.row.selecting .rbody{cursor:pointer}
.selbar{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.selbar button{color:var(--blue);font-size:17px;padding:6px 2px}
.selbar button.red{color:var(--red)}
.selbar button:disabled{color:var(--label3)}
.selbar span{color:var(--label2);font-size:15px}
.menu .ind button{padding-left:46px}
.menu .lhead button{font-weight:600}
.menu .lhead .dot{width:14px;height:14px;border-radius:50%;flex:none}
.copyfb{width:100%;min-height:200px;border:0;border-radius:10px;padding:12px;background:var(--card);font-size:15px;line-height:1.45;-webkit-user-select:text;user-select:text}

/* 共用狀態 */
.syncline{display:flex;align-items:center;gap:7px;width:100%;margin:0 0 10px;padding:2px 2px;font-size:13px;color:var(--label2);text-align:left}
.syncline .stxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncline .shelp{color:var(--blue);flex:none}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--grey);flex:none}
.sdot.synced{background:var(--green)}
.sdot.saving,.sdot.syncing{background:var(--orange);animation:blink 1s infinite}
.sdot.offline,.sdot.readonly{background:var(--red)}
@keyframes blink{50%{opacity:.3}}
.avs{display:flex;flex:none}
.avs img{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bg);margin-left:-6px;object-fit:cover}
.avs img:first-child{margin-left:0}
.byw{display:inline-flex;align-items:center;gap:4px}
.asg{color:var(--label2)}
.stamp{color:var(--label3)}
.stamp.done{color:var(--green)}
.lrow .lshared{font-size:13px;flex:none;color:var(--label2);background:var(--fill);border-radius:10px;padding:1px 8px}
.lrow .lshared:empty{display:none}
.asg.me{color:var(--green);font-weight:600}
.byw img{width:14px;height:14px;border-radius:50%;object-fit:cover}

/* 新手友善 */
.welcome{background:var(--card);border-radius:14px;padding:18px 16px 16px;margin:4px 0 6px}
.welcome .wt{font-size:20px;font-weight:700}
.welcome .ws{color:var(--label2);font-size:15px;margin:4px 0 14px}
.wbtn{width:100%;height:50px;border-radius:12px;background:var(--fill);color:var(--blue);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.wbtn+.wbtn{margin-top:10px}
.wbtn.primary{background:var(--blue);color:#fff}
.wbtn .wi{display:grid;place-items:center}
.wbtn .wi svg{width:18px;height:18px}
.ebtns{max-width:320px;margin:20px auto 0}
.tips{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:8px 8px 8px 12px;margin:6px 0 4px;font-size:13px;color:var(--label2)}
.tips span{flex:1;line-height:1.4}
.tips button{color:var(--blue);font-weight:600;font-size:14px;padding:6px 8px;flex:none}
.pastehint{background:var(--card);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:15px;color:var(--blue);font-weight:600}

/* 分段按鈕 */
.seg{display:flex;gap:4px;background:var(--fill);padding:3px;border-radius:10px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:15px;color:var(--label2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 分類圖案 */
.sectiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
.stile{background:var(--bg);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;min-width:0;transition:transform .1s}
.stile:active{transform:scale(.96)}
.stile.on{border-color:var(--c, var(--blue));background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.stile .em{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--card);margin-bottom:2px}
.stile.on .em{background:var(--bg)}
.stile .nm{font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.stile .ct{font-size:12px;color:var(--label2)}
.stile.add .em{background:transparent;border:1.6px dashed var(--ring);color:var(--label2);font-size:22px}
.stile.add .nm{color:var(--label2);font-weight:500}
.emgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px}
.emb{aspect-ratio:1;border-radius:12px;font-size:26px;display:grid;place-items:center}
.emb.on{background:var(--fill2)}
.emb:active{background:var(--fill)}

/* 登入 */
.loginbtn{flex:none;color:#fff;background:var(--blue);border-radius:14px;padding:3px 12px;font-weight:600;font-size:14px}
.acct{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--label);font-weight:600;font-size:14px;background:var(--card);border-radius:16px;padding:2px 10px 2px 3px}
.acct img,.acct i,.acctcard img,.acctcard>i{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.acctcard{display:flex;align-items:center;gap:14px;padding:16px}
.acctcard img,.acctcard>i{width:52px;height:52px;font-size:22px;flex:none}
.acctcard b{font-size:18px}
.acctcard div div{color:var(--label2);font-size:14px;word-break:break-all}
.acctcard .acctst{color:var(--green)}
.gbtn{width:100%;height:50px;border-radius:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.glogo{width:20px;height:20px;display:grid}
.glogo svg{width:20px;height:20px}
.ldiv{display:flex;align-items:center;gap:10px;color:var(--label2);font-size:13px;margin:-8px 4px 14px}
.ldiv::before,.ldiv::after{content:"";flex:1;height:.5px;background:var(--sep)}
.lin2{width:100%;height:48px;border:0;border-radius:10px;background:var(--fill);padding:0 14px;font-size:17px;outline:none;margin-bottom:10px}
.lin2:focus{box-shadow:0 0 0 2px var(--blue)}
.lerr{color:var(--red);font-size:14px;margin:-2px 2px 10px;line-height:1.4}
.lrow2{display:flex;justify-content:space-between;margin-top:6px}
.wlink{color:var(--blue);font-size:15px;padding:10px 4px;display:block;margin:6px auto 0}
.lrow2 .wlink{margin:0}

/* 順序 */
.nb{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--c, var(--blue));color:#fff;font-size:12px;font-weight:700;margin-right:7px;vertical-align:2px;line-height:1}
.row.done .nb{display:none}
.ordbtns{display:flex;gap:8px;flex:none;margin-top:-4px}
.ordbtns button{width:40px;height:34px;border-radius:10px;background:var(--fill);color:var(--blue);display:grid;place-items:center}
.ordbtns button svg{width:18px;height:18px}
.ordbtns button:disabled{opacity:.25}
.ordbtns button:active{background:var(--fill2)}
.row.ordering .circle{opacity:.4}

/* ===== 底部面板 ===== */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:700px;margin:0 auto;background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:calc(var(--vvh, 100dvh) - var(--sat) / var(--z, 1) - 12px);display:flex;flex-direction:column}
.sheet.show{transform:none}
.sheet:not(.show){visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet{bottom:var(--kb, 0px)}

<script>
/* =====================================================================
   拆分引擎：把一大段文字拆成一個一個提醒事項
   ===================================================================== */
const Splitter = (() => {
  const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳❶❷❸❹❺❻❼❽❾❿➀➁➂➃➄➅➆➇➈➉➊➋➌➍➎➏➐➑➒➓⑴⑵⑶⑷⑸⑹⑺⑻⑼⑽⒈⒉⒊⒋⒌⒍⒎⒏⒐⒑';
  const DONE_RE = /^\s*(?:\[\s*[xX✓✔]\s*\]|【\s*[xX✓✔]\s*】|[☑✓✔✅])/;
  const STRIP = [
    /^\s*(?:\[\s*[xX✓✔]?\s*\]|【\s*[xX✓✔]?\s*】|[☐☑☒✅⬜◻◽□▢🔲🔳])\s*/u,
    /^\s*(?:[-–—*+•·・●○◦▪▫▸▹►▶➤➜→⇒»※◆◇★☆]+|>(?!=))\s*/u,
    /^\s*第\s*[0-9０-９一二三四五六七八九十百]+\s*[項项條条步點点件個个][、.．:：]?\s*/,
    /^\s*[(（\[【]\s*(?:[0-9０-９]{1,3}|[一二三四五六七八九十]{1,3}|[a-zA-Z])\s*[)）\]】]\s*/,
    /^\s*(?:[0-9０-９]{1,3}|[一二三四五六七八九十]{1,3})\s*[.．、)）](?![0-9０-９])\s*/,
    /^\s*(?:[a-zA-Z]|[ivxIVX]{1,4})[.)）](?=\s)\s*/,
    new RegExp('^\\s*[' + CIRCLED + ']\\s*'),
    /^\s*(?:todo|to-do|待辦|代辦|任務)\s*[:：]\s*/i,
  ];
  const HEADER_WORDS = /^(?:to-?do(?:\s*list)?|todos?|待辦(?:事項|清單)?|代辦(?:事項|清單)?|要做的事|清單|任務(?:清單)?|今日待辦|今天要做|提醒事項|checklist)$/i;
  const JUNK_RE = /^[\s\p{P}\p{S}]*$/u;
  const INLINE_RE = new RegExp('(^|[\\s，,；;。])((?:[0-9０-９]{1,2})[.．、)）](?![0-9０-９])|[(（][0-9０-９]{1,2}[)）])|([' + CIRCLED + '])', 'g');
  const SENT_RE = /([。；;]+|[！!？?]+)/;
  const ENUM_RE = /、/;
  function sentSplit(line){
    const bits = line.split(SENT_RE), out = [];
    for (let i = 0; i < bits.length; i += 2){
      const d = bits[i + 1] || '';
      const t = bits[i] + (/[！!？?]/.test(d) ? d.slice(0, 1) : '');
      if (t.trim()) out.push(t);
    }
    return out;
  }
  const norm = s => s.replace(/[ 　\t]+/g, ' ').replace(/ {2,}/g, ' ').trim();
  const key = s => s.toLowerCase().replace(/[\s\p{P}]+/gu, '');
  function clean(raw){
    let s = raw, done = false;
    for (let i = 0; i < 5; i++){
      const before = s;
      for (const re of STRIP){ if (DONE_RE.test(s)) done = true; s = s.replace(re, ''); }
      if (s === before) break;
    }
    s = norm(s).replace(/[\s，,、；;。]+$/u, '');
    return { text: s, done };
  }
  function inlineSplit(line){
    const idx = [];
    INLINE_RE.lastIndex = 0;
    let m;
    while ((m = INLINE_RE.exec(line))){
      idx.push(m.index + (m[1] ? m[1].length : 0));
      if (m[0].length === 0) INLINE_RE.lastIndex++;
    }
    if (idx.length < 2) return null;
    if (idx[0] > 0 && line.slice(0, idx[0]).trim()) idx.unshift(0);
    const out = [];
    for (let i = 0; i < idx.length; i++) out.push(line.slice(idx[i], idx[i + 1]));
    return out;
  }
  function split(text){
    const lines = String(text || '').replace(/\r\n?/g, '\n').replace(/[\u2028\u2029]/g, '\n').split('\n');
    const nonEmpty = lines.filter(l => l.trim()).length;
    const parts = [];
    for (const line of lines){
      if (!line.trim()) continue;
      const inl = inlineSplit(line);
      if (inl){ parts.push(...inl); continue; }
      const sp = sentSplit(line).filter(p => clean(p).text.length >= 2);
      if (sp.length >= 2 && (line.trim().length >= 30 || nonEmpty <= 2)){ parts.push(...sp); continue; }
      if (nonEmpty === 1){
        const en = line.split(ENUM_RE).filter(p => p.trim());
        if (en.length >= 3 && en.every(p => p.trim().length <= 20)){ parts.push(...en); continue; }
      }
      parts.push(line);
    }
    const items = parts.map(clean).filter(x => x.text && !JUNK_RE.test(x.text));
    return items.map(x => {
      const isColon = /[:：]$/.test(x.text) && x.text.length <= 30 && items.length > 1;
      const isWord = HEADER_WORDS.test(x.text.replace(/[:：]$/, '').trim()) && items.length > 1;
      return (isColon || isWord) ? { ...x, kind: 'header', text: x.text.replace(/[:：]$/, '') } : { ...x, kind: 'item' };
    });
  }
  /* 回傳要變成提醒事項的部分（略過標題行） */
  function items(text){ return split(text).filter(x => x.kind === 'item'); }
  return { split, items, key };
})();
if (typeof module !== 'undefined') module.exports = Splitter;
</script>

(() => {
  const root = document.documentElement;
  function fit(){
    root.style.zoom = '';
    let z = 1;
    try {
      const coarse = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
      const portrait = matchMedia('(orientation: portrait)').matches;
      const sw = (portrait ? Math.min : Math.max)(screen.width, screen.height);
      const w = innerWidth;
      if (coarse && sw > 0 && w > sw * 1.2) z = Math.min(3, w / sw);
    } catch {}
    root.style.setProperty('--z', z);
    if (z !== 1) root.style.zoom = z;
  }
  fit();
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(fit, 150); });
  addEventListener('orientationchange', () => setTimeout(fit, 300));
})();
/* 正在打字時，把最下面那排按鈕藏起來，不要擋住 */
(() => {
  const isField = el => el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|date|time)$/i.test(el.type)));

})();

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function fmtDay(s){
  const n = dayDiff(s), d = parseD(s), now = new Date();
  if (n === 0) return '今天';
  if (n === 1) return '明天';
  if (n === -1) return '昨天';
  if (n > 1 && n < 7) return '星期' + WEEK[d.getDay()];
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日`;
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}
function fmtTime(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h < 12 ? '上午' : '下午';
  return `${ap}${(h % 12) || 12}:${pad(m)}`;
}

  const n = dayDiff(ymd(d));
  if (long) return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）${hm}`;
  if (n === 0) return `今天 ${hm}`;
  if (n === -1) return `昨天 ${hm}`;
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}/${d.getDate()}`;
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

const repeatLabel = r => (REPEATS.find(x => x[0] === r) || REPEATS[0])[1];
function nextDate(s, rule){
  const d = parseD(s);
  const step = () => {
    switch (rule){
      case 'daily': d.setDate(d.getDate() + 1); break;
      case 'weekdays': do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); break;
      case 'weekends': do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 0 && d.getDay() !== 6); break;
      case 'weekly': d.setDate(d.getDate() + 7); break;
      case 'biweekly': d.setDate(d.getDate() + 14); break;
      case 'monthly': { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); break; }

function undo(){

  const { before, after } = undoSnap; undoSnap = null; edit = null;
  if (!after){ hideToast(); return; }
  const B = docMap(before), A = docMap(after);
  const keys = new Set([...B.keys(), ...A.keys()]);
  let listsTouched = false;
  for (const k of keys){
    const b = B.get(k), a = A.get(k);
    if (b && a && b[0] === a[0]) continue;
    const isList = k[0] === 'l', id = k.slice(2);

    const order = before.lists.map(l => l.id);
    state.lists.sort((x, y) => { const a = order.indexOf(x.id), b = order.indexOf(y.id); return (a < 0 ? 1e9 : a) - (b < 0 ? 1e9 : b); });

function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k.startsWith('aria-')) el.setAttribute(k, String(v));
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
  return el;
}

/* 「」『』【】和 **粗體** 裡的字當作重點，用顏色標出來 */
function withHighlights(text){
  const frag = document.createDocumentFragment();
  const re = /(「[^」\n]{1,40}」|『[^』\n]{1,40}』|【[^】\n]{1,40}】|\*\*[^*\n]{1,40}\*\*)/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) frag.append(text.slice(last, m.index));
    const t = m[0].startsWith('**') ? m[0].slice(2, -2) : m[0];
    frag.append(h('span', { class: 'hl' }, t));
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}

  if (prefixCache.has(listId)) return prefixCache.get(listId);

  let p = '';
  if (ns.length >= 2){
    p = ns[0];
    for (const n of ns){ let k = 0; while (k < p.length && k < n.length && p[k] === n[k]) k++; p = p.slice(0, k); if (!p) break; }
    // 切在標點或括號前，不要切在字中間
    let cut = -1;
    for (let k = p.length - 1; k >= 0; k--){
      const ch = p[k];
      if ('「『【'.includes(ch)){ cut = k; break; }
      if ('，、。：:；; '.includes(ch)){ cut = k + 1; break; }

}

/* =====================================================================
   滑動（左滑）與長按拖曳排序
   ===================================================================== */
const ACTW = 272;
let suppressUntil = 0;
document.addEventListener('click', e => { if (Date.now() < suppressUntil){ e.stopPropagation(); e.preventDefault(); } }, true);

function bindGestures(li, fg, it, vm, isEditing){
  fg.addEventListener('pointerdown', e => {
    if (isEditing || selectMode || orderMode || (e.button !== undefined && e.button > 0)) return;
    if (e.target.closest('textarea,.circle,.infobtn,.chip')) return;
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    const base = li.classList.contains('open') ? -ACTW : 0;

      mode = 'armed'; pressing = true; li.classList.add('pressed');
      try { navigator.vibrate && navigator.vibrate(10); } catch {}

    const move = ev => {
      if (ev.pointerId !== pid || mode === 'drag') return;

        return;
      }

        clearTimeout(lp);
        if (Math.abs(dx) > Math.abs(dy) * 1.2 && !edit){ mode = 'swipe'; swiping = true; li.classList.add('swiping'); closeSwipes(li); }
        else mode = 'scroll';

        if (x > 0) x = 0;
        fg.style.transform = `translateX(${x}px)`;
        const w = li.offsetWidth;
        li.querySelector('.acts').style.width = Math.max(-x, 0) + 'px';
        li.classList.toggle('full', x < -w * 0.62);

function beginDrag(li, startY, pid){
  const ul = li.parentElement;
  const OB = '.row[data-id], .shdr';
  dragging = true;
  closeSwipes();
  try { navigator.vibrate && navigator.vibrate(12); } catch {}
  li.classList.add('dragging');
  const offY = startY - li.getBoundingClientRect().top;

    raf = 0;

    }
    let next = nextOb(li);

  };

}

async function toClipboard(text){
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    // iPhone：不能用 readonly，要用可編輯的元素加上選取範圍才複製得到
    const t = document.createElement('textarea');
    t.value = text; t.contentEditable = 'true';
    t.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0';
    document.body.append(t);
    const r = document.createRange(); r.selectNodeContents(t);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    t.focus({ preventScroll: true }); t.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); t.blur(); t.remove(); sel.removeAllRanges(); return ok;
  } catch { return false; }
}

  const n = state.items.filter(i => i.listId === l.id).length;
  const body = h('div', {},
    h('p', { class: 'cfm' }, l.shared ? `這會刪除「${l.name}」裡的全部 ${n} 個提醒事項，所有一起記的人都會看不到。只想自己不看的話，請用「離開這個共用列表」。` : `這會刪除「${l.name}」裡的全部 ${n} 個提醒事項。`),
    h('button', { class: 'bigbtn red', onclick: () => {
      closeSheet(); snapshot();
      state.lists = state.lists.filter(x => x.id !== l.id);
      state.items = state.items.filter(i => i.listId !== l.id);
      if (!state.lists.length) state.lists.push(defaultList());
      route = { name: 'home' }; commit();
      showToast(`已刪除列表「${trunc(l.name, 10)}」`, [{ label: '復原', fn: () => { undo(); } }]);
    } }, '刪除列表'),
    h('button', { class: 'bigbtn', onclick: closeSheet }, '取消'));
  openSheet({ title: '刪除列表？', left: '', right: '', body });
}

/* =====================================================================
   Toast
   ===================================================================== */
let toastTimer;
function showToast(msg, actions = []){
  $('#toastMsg').textContent = msg;
  const box = $('#toastActs'); box.textContent = '';
  actions.forEach(a => box.append(h('button', { onclick: () => { hideToast(); a.fn(); } }, a.label)));
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actions.length ? 5500 : 2200);
}
function hideToast(){ $('#toast').classList.remove('show'); clearTimeout(toastTimer); }

/* =====================================================================
   到時間提醒（App 開著時跳出通知）
   ===================================================================== */
const bannerQ = [];
let bannerCur = null, bannerTimer = null;
let notifiedLocal = (() => { try { return JSON.parse(localStorage.getItem('yige-notified')) || {}; } catch { return {}; } })();
function checkDue(){
  const now = Date.now();
  let changed = false;
  for (const it of state.items){
    if (it.done || !it.due) continue;
    const ft = fireTime(it.due);
    const key = it.due.date + 'T' + (it.due.time || '09:00');
    if (ft <= now && now - ft < 12 * 3600e3 && notifiedLocal[it.id] !== key){
      notifiedLocal[it.id] = key; changed = true;
      if (!bannerQ.includes(it.id) && (!bannerCur || bannerCur !== it.id)) bannerQ.push(it.id);
    }
  }
  if (changed){ try { localStorage.setItem('yige-notified', JSON.stringify(notifiedLocal)); } catch {} if (!edit && !dragging && !swiping && !sheetOpen()) render(); }
  nextBanner();
}
function nextBanner(){
  if (bannerCur || !bannerQ.length) return;
  const id = bannerQ.shift(); const it = itemById(id);
  if (!it || it.done) return nextBanner();
  bannerCur = id;
  const l = listById(it.listId);
  const b = $('#banner'); b.textContent = '';
  b.append(
    h('div', { class: 'bh' }, h('i', { html: `<span style="color:${colorOf(l)};display:contents">${UI.bell}</span>` }), h('span', {}, '提醒事項'), h('span', { class: 'sp' }), h('span', {}, '現在')),
    h('div', { class: 'bt' }, it.title),
    h('div', { class: 'bs' }, (l ? l.name + ' · ' : '') + fmtDue(it.due)),
    h('div', { class: 'ba' },
      h('button', { onclick: e => { e.stopPropagation(); hideBanner(); const x = itemById(id); if (x && !x.done) toggleDone(id); } }, '標示為完成'),
      h('button', { onclick: e => { e.stopPropagation(); hideBanner(); snooze(id, 10); } }, '10 分鐘後'),
      h('button', { onclick: e => { e.stopPropagation(); hideBanner(); } }, '關閉')));
  b.onclick = () => { hideBanner(); const x = itemById(id); if (x){ go({ name: 'list', id: x.listId }); setTimeout(() => openDetail(id), 50); } };
  b.classList.add('show');
  try { navigator.vibrate && navigator.vibrate([30, 60, 30]); } catch {}
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(hideBanner, 12000);
}
function hideBanner(){
  $('#banner').classList.remove('show'); clearTimeout(bannerTimer);
  bannerCur = null; setTimeout(nextBanner, 400);
}
function snooze(id, mins){
  const it = itemById(id); if (!it) return;
  const d = new Date(Date.now() + mins * 60e3);
  it.due = { date: ymd(d), time: `${pad(d.getHours())}:${pad(d.getMinutes())}` };
  it.notified = '';
  commit();
  showToast(`會在 ${fmtTime(it.due.time)} 再提醒你`);
}
setInterval(checkDue, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ checkDue(); if (!edit) render(); } });
// 跨日時更新「今天」
let lastDay = today();
setInterval(() => { if (today() !== lastDay){ lastDay = today(); if (!edit && !dragging && !swiping) render(); } }, 60000);

/* =====================================================================
   啟動
   ===================================================================== */
render();
setTimeout(checkDue, 800);
cloud.init();
fb.init();
// 放在 GitHub Pages 時：可以加到主畫面、離線也能開
if (!IN_CLAUDE && 'serviceWorker' in navigator && location.protocol === 'https:'){
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
window.__app = { get state(){ return state; } };
})();
</script>
